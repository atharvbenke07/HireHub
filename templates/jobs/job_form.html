{% extends 'base.html' %}

{% block title %}
Post Job - HireHub
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="mb-4">
                    {% if object %}
                        Edit Job
                    {% else %}
                        Post New Job
                    {% endif %}
                </h2>


                {% if form.non_field_errors %}

                    <div class="alert alert-danger">

                        {{ form.non_field_errors }}

                    </div>

                {% endif %}


                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary">

                        {% if object %}
                            Update Job
                        {% else %}
                            Create Job
                        {% endif %}

                    </button>

                    <a
                        href="{% url 'job_list' %}"
                        class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
