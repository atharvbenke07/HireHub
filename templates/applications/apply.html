{% extends 'base.html' %}

{% block title %}
Apply - {{ job.title }}
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-body">

                <h2>
                    Apply for {{ job.title }}
                </h2>

                <p class="text-muted">
                    {{ job.company.company_name }}
                </p>

                <hr>

                <form
                    method="POST"
                    enctype="multipart/form-data">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-success">

                        Submit Application

                    </button>

                    <a
                        href="{% url 'job_detail' job.pk %}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
